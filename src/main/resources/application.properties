spring.application.name=kk-digital-pharmacy-backend
server.port=${PORT:8080}
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties


# Database Configuration (Aiven Cloud MySQL with Auto-Reconnect & Heartbeat)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Cloud Connection Resilience (prevents Aiven timeout drops)
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Logging
logging.level.root=INFO
logging.level.lk.ijse.pharmacy_backend=DEBUG
logging.level.org.springframework.security=INFO

# Google Generative AI (Gemini) Assistant Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
